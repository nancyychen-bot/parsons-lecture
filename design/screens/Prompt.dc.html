<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spoken prompt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../tokens/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<main data-theme="live" style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-serif)">
<p class="orr-label orr-muted" style="position: absolute; left: 64px; top: 48px; margin: 0">{{p.meta}}</p>
<svg class="orr-svg orr-mark" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="{{p.markLabel}}" style="position: absolute; right: 64px; top: 48px">
<circle class="{{m.core}}" cx="32" cy="32" r="2.4"></circle>
<circle class="{{m.r1}}" cx="32" cy="32" r="9.5"></circle>
<circle class="{{m.r2}}" cx="32" cy="32" r="19"></circle>
<circle class="{{m.r3}}" cx="32" cy="32" r="28.5"></circle>
<sc-if value="{{m.axis}}" hint-placeholder-val="{{ false }}">
<g transform="rotate(-58 32 32)">
<line class="orr-axis" x1="0.1" y1="32" x2="63.9" y2="32"></line>
<line class="orr-axis" x1="0.1" y1="29" x2="0.1" y2="35"></line>
<line class="orr-axis" x1="63.9" y1="29" x2="63.9" y2="35"></line>
</g>
</sc-if>
</svg>

<div style="position: absolute; left: 64px; right: 64px; bottom: 156px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 14px">
<p class="orr-label orr-muted" style="margin: 0">Spoken prompt · say it to the person next to you, or type it in chat</p>
<hr class="orr-rule" style="width: 96px">
</div>
<h1 style="margin: 0; max-width: 1100px; font-size: 68px; line-height: 1.2; font-weight: 400; font-style: italic; letter-spacing: -0.01em; font-variation-settings: 'opsz' 72"><sc-for list="{{p.parts}}" as="part" hint-placeholder-count="5"><sc-if value="{{part.blank}}" hint-placeholder-val="{{ false }}"><span aria-label="blank" style="display: inline-block; width: 220px; height: 0.9em; border-bottom: 3px solid var(--ink); margin: 0 12px; vertical-align: baseline"></span></sc-if><sc-if value="{{part.text}}" hint-placeholder-val="{{ true }}">{{part.text}}</sc-if></sc-for></h1>
<p class="orr-muted" style="margin: 0; font-size: 28px; line-height: 1.35">{{p.sub}}</p>
</div>

<p class="orr-label orr-muted" style="position: absolute; left: 64px; bottom: 48px; margin: 0">{{p.plate}}</p>

<nav aria-label="Sections" style="position: absolute; right: 64px; bottom: 48px; display: flex; align-items: center; gap: 28px">
<svg class="orr-svg" viewBox="0 0 172 12" width="172" height="12" aria-hidden="true">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="9">
<circle class="{{d.cls}}" cx="{{d.cx}}" cy="6" r="{{d.r}}"></circle>
</sc-for>
</svg>
<a class="orr-btn orr-btn--text" href="{{p.prev}}" style="display: inline-flex; align-items: center; color: var(--muted)">Previous</a>
<a class="orr-btn orr-btn--text" href="{{p.next}}" style="display: inline-flex; align-items: center; color: var(--muted)">Next</a>
</nav>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"section":{"editor":"enum","options":["04 Product","05 Experience","06 World","07 Connect the circles"],"default":"04 Product"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var B = { blank: true, text: '' };
    function t(s) { return { blank: false, text: s }; }
    var P = {
      '04 Product': { n: 4, fill: 1, axis: false, meta: '04 / 09 · Product · Core', plate: 'Plate 04 · r = 1 · your turn',
        parts: [t('For '), B, t(', this product makes it possible to '), B, t('.')],
        sub: 'No feature lists. No buzzwords.', prev: 'OneTask.dc.html', next: 'KeyLine04.dc.html' },
      '05 Experience': { n: 5, fill: 2, axis: false, meta: '05 / 09 · Experience · Near orbit', plate: 'Plate 05 · r = 2 · your turn',
        parts: [t('We want this moment to feel '), B, t(', so we will '), B, t('.')],
        sub: 'Pick one moment. Name one feeling, then one choice that creates it.', prev: 'BlankVsTemplate.dc.html', next: 'KeyLine05.dc.html' },
      '06 World': { n: 6, fill: 3, axis: false, meta: '06 / 09 · World · Far orbit', plate: 'Plate 06 · r = 3 · your turn',
        parts: [t('People can make this their own by '), B, t('.')],
        sub: 'What could you invite them to contribute that you couldn’t make alone?', prev: 'ExampleCards.dc.html', next: 'Distinction.dc.html' },
      '07 Connect the circles': { n: 7, fill: 3, axis: true, meta: '07 / 09 · Connect the circles', plate: 'Plate 07 · the axis · your turn',
        parts: [t('Where does the experience stop proving the belief?')],
        sub: 'Name the ring. Then name the repair.', prev: 'Contradiction.dc.html', next: 'NancysBuild.dc.html' }
    };
    var p = P[this.props.section] || P['04 Product'];
    var f = p.fill;
    p.markLabel = 'Progress mark: ' + f + ' of 3 rings reached' + (p.axis ? ', axis drawn' : '');
    var m = {
      core: f >= 1 ? 'orr-core' : 'orr-core--unfilled',
      r1: f >= 1 ? 'orr-ring' : 'orr-ring orr-ring--unfilled',
      r2: f >= 2 ? 'orr-ring' : 'orr-ring orr-ring--unfilled',
      r3: f >= 3 ? 'orr-ring orr-ring--world' : 'orr-ring orr-ring--unfilled',
      axis: p.axis
    };
    var dots = [];
    for (var i = 1; i <= 9; i++) {
      dots.push({ cx: 6 + (i - 1) * 20, r: i === p.n ? 5 : 4.5, cls: i < p.n ? 'orr-tp' : (i === p.n ? 'orr-core' : 'orr-core--unfilled') });
    }
    return { p: p, m: m, dots: dots };
  }
}
</script>
</body>
</html>
