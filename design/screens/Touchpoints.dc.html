<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 — Touchpoint select</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../tokens/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<main data-theme="live" style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-serif)">
<p class="orr-label orr-muted" style="position: absolute; left: 64px; top: 48px; margin: 0">02 / 09 · What is a product?</p>
<svg class="orr-svg orr-mark" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Progress mark: no rings reached yet" style="position: absolute; right: 64px; top: 48px">
<circle class="orr-core--unfilled" cx="32" cy="32" r="2.4"></circle>
<circle class="orr-ring orr-ring--unfilled" cx="32" cy="32" r="9.5"></circle>
<circle class="orr-ring orr-ring--unfilled" cx="32" cy="32" r="19"></circle>
<circle class="orr-ring orr-ring--unfilled" cx="32" cy="32" r="28.5"></circle>
</svg>

<div role="group" aria-label="Touchpoints of a coffee shop" style="position: absolute; left: 64px; top: 96px; width: 740px; height: 576px">
<svg class="orr-svg" viewBox="0 0 740 576" width="740" height="576" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<sc-if value="{{orbit}}" hint-placeholder-val="{{ true }}">
<circle class="orr-ring orr-ring--unfilled" cx="360" cy="288" r="210"></circle>
</sc-if>
<sc-if value="{{mapped}}" hint-placeholder-val="{{ false }}">
<circle class="orr-ring" cx="360" cy="288" r="70"></circle>
<circle class="orr-ring" cx="360" cy="288" r="140"></circle>
<circle class="orr-ring orr-ring--world" cx="360" cy="288" r="210"></circle>
<text x="360" y="224" style="text-anchor: middle; font-size: 18px">PRODUCT</text>
<text x="360" y="154" style="text-anchor: middle; font-size: 18px">EXPERIENCE</text>
<text x="360" y="84" style="text-anchor: middle; font-size: 18px">WORLD</text>
</sc-if>
<circle class="orr-ring" cx="360" cy="288" r="26"></circle>
<circle class="orr-core" cx="360" cy="288" r="17"></circle>
<circle class="orr-ring" cx="394" cy="288" r="9"></circle>
</svg>
<sc-for list="{{tps}}" as="tp" hint-placeholder-count="9">
<button type="button" aria-pressed="{{tp.on}}" onClick="{{tp.toggle}}" style="position: absolute; {{tp.pos}}; height: 44px; display: flex; flex-direction: {{tp.dir}}; align-items: center; gap: 10px; padding: 0; margin: 0; background: transparent; border: 0; color: var(--ink); cursor: pointer; font-family: var(--font-mono); font-size: 18px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap">
<span aria-hidden="true" style="width: 14px; height: 14px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2.5px solid var(--ink); background: {{tp.fill}}"></span>
<span style="background: var(--ground); padding: 2px 4px">{{tp.label}}</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 864px; top: 128px; width: 352px; display: flex; flex-direction: column; gap: 28px">
<figure style="margin: 0; display: flex; align-items: flex-end; gap: 20px">
<img class="orr-cutout" src="../assets/cutouts/telescope.png" alt="Engraved brass telescope on a tripod" style="height: 240px; width: auto; flex: none">
<figcaption style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px">
<span class="orr-label">Fig. 02 · Telescope</span>
<span class="orr-label orr-muted">Your product, seen from outside</span>
</figcaption>
</figure>
<h1 style="margin: 0; font-size: 46px; line-height: 1.05; font-weight: 400; letter-spacing: -0.01em; font-variation-settings: 'opsz' 72">Every touchpoint is part of the product</h1>
</div>

<div style="position: absolute; left: 64px; bottom: 48px; display: flex; align-items: center; gap: 24px">
<button type="button" class="{{revealClass}}" aria-pressed="{{mapped}}" onClick="{{reveal}}" style="flex: none">{{revealLabel}}</button>
<p class="orr-muted" role="status" style="margin: 0; max-width: 380px; font-size: 20px; line-height: 1.3; font-style: italic">{{statusLine}}</p>
</div>

<nav aria-label="Sections" style="position: absolute; right: 64px; bottom: 48px; display: flex; align-items: center; gap: 28px">
<svg class="orr-svg" viewBox="0 0 172 12" width="172" height="12" aria-hidden="true">
<circle class="orr-tp" cx="6" cy="6" r="4.5"></circle>
<circle class="orr-core" cx="26" cy="6" r="5"></circle>
<circle class="orr-core--unfilled" cx="46" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="66" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="86" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="106" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="126" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="146" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="166" cy="6" r="4.5"></circle>
</svg>
<a class="orr-btn orr-btn--text" href="WhatIsProduct.dc.html" style="display: inline-flex; align-items: center; color: var(--muted)">Previous</a>
<a class="orr-btn orr-btn--text" href="Reveal.dc.html" style="display: inline-flex; align-items: center; color: var(--muted)">Next</a>
</nav>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["orbit","mapped"],"default":"orbit"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mapped: props.start === 'mapped', on: { coffee: true, app: true, menu: true } };
  }
  renderVals() {
    var W = 740, CX = 360, CY = 288;
    var mapped = !!this.state.mapped;
    var on = this.state.on || {};
    var self = this;
    var defs = [
      { id: 'coffee', label: 'Coffee', orbit: [210, -90, 'r'], map: [70, 0, 'r'] },
      { id: 'app', label: 'Mobile order app', orbit: [210, -50, 'r'], map: [70, 180, 'l'] },
      { id: 'menu', label: 'Menu', orbit: [210, -10, 'r'], map: [105, 130, 'l'] },
      { id: 'ordering', label: 'Ordering', orbit: [210, 30, 'r'], map: [140, -40, 'r'] },
      { id: 'help', label: 'Getting help', orbit: [210, 70, 'r'], map: [140, -125, 'l'] },
      { id: 'staff', label: 'Staff', orbit: [210, 110, 'l'], map: [140, 40, 'r'] },
      { id: 'seating', label: 'Seating', orbit: [210, 150, 'l'], map: [140, 90, 'r'] },
      { id: 'regulars', label: 'Regulars', orbit: [210, 190, 'l'], map: [210, 200, 'l'] },
      { id: 'reputation', label: 'Reputation', orbit: [210, 230, 'l'], map: [175, 10, 'r'] }
    ];
    var tps = defs.map(function (d) {
      var p = mapped ? d.map : d.orbit;
      var a = p[1] * Math.PI / 180;
      var x = Math.round(CX + p[0] * Math.cos(a));
      var y = Math.round(CY + p[0] * Math.sin(a));
      var pos = p[2] === 'r'
        ? 'left: ' + (x - 7) + 'px; top: ' + (y - 22) + 'px'
        : 'right: ' + (W - x - 7) + 'px; top: ' + (y - 22) + 'px';
      var isOn = !!on[d.id];
      return {
        label: d.label,
        on: isOn,
        pos: pos,
        dir: p[2] === 'r' ? 'row' : 'row-reverse',
        fill: isOn ? 'var(--ink)' : 'var(--ground)',
        toggle: function () {
          var next = Object.assign({}, self.state.on);
          next[d.id] = !next[d.id];
          self.setState({ on: next });
        }
      };
    });
    return {
      tps: tps,
      mapped: mapped,
      orbit: !mapped,
      statusLine: mapped ? 'The app is one dot on the inner ring. Points between rings belong to both.' : 'Which of these count as the product? Call them out.',
      revealLabel: mapped ? 'Back to the orbit' : 'See the bigger picture',
      revealClass: mapped ? 'orr-btn' : 'orr-btn orr-btn--primary',
      reveal: function () { self.setState({ mapped: !self.state.mapped }); }
    };
  }
}
</script>
</body>
</html>
