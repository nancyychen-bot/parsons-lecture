<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 — Circle explorer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../tokens/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<main data-theme="live" style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-serif)">
<p class="orr-label orr-muted" style="position: absolute; left: 64px; top: 48px; margin: 0">03 / 09 · The three circles</p>
<svg class="orr-svg orr-mark" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Progress mark: Product reached" style="position: absolute; right: 64px; top: 48px">
<circle class="orr-core" cx="32" cy="32" r="2.4"></circle>
<circle class="orr-ring" cx="32" cy="32" r="9.5"></circle>
<circle class="orr-ring orr-ring--unfilled" cx="32" cy="32" r="19"></circle>
<circle class="orr-ring orr-ring--unfilled" cx="32" cy="32" r="28.5"></circle>
</svg>

<svg class="orr-svg" viewBox="0 0 480 480" width="480" height="480" aria-hidden="true" style="position: absolute; left: 64px; top: 136px">
<circle class="orr-core" cx="240" cy="240" r="18"></circle>
<circle class="{{c1}}" cx="240" cy="240" r="72"></circle>
<circle class="{{c2}}" cx="240" cy="240" r="144"></circle>
<circle class="{{c3}}" cx="240" cy="240" r="216"></circle>
<text x="240" y="174" style="text-anchor: middle; font-size: 18px; fill: {{f1}}">PRODUCT</text>
<text x="240" y="102" style="text-anchor: middle; font-size: 18px; fill: {{f2}}">EXPERIENCE</text>
<text x="240" y="30" style="text-anchor: middle; font-size: 18px; fill: {{f3}}">WORLD</text>
<circle cx="240" cy="240" r="216" onClick="{{pickWorld}}" style="fill: none; stroke: transparent; stroke-width: 40px; pointer-events: stroke; cursor: pointer"></circle>
<circle cx="240" cy="240" r="144" onClick="{{pickExperience}}" style="fill: none; stroke: transparent; stroke-width: 40px; pointer-events: stroke; cursor: pointer"></circle>
<circle cx="240" cy="240" r="72" onClick="{{pickProduct}}" style="fill: transparent; stroke: transparent; stroke-width: 40px; pointer-events: all; cursor: pointer"></circle>
</svg>

<div role="group" aria-label="Choose a ring" style="position: absolute; left: 600px; top: 104px; display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" class="orr-btn" aria-pressed="{{isProduct}}" onClick="{{pickProduct}}">Product</button>
<button type="button" class="orr-btn" aria-pressed="{{isExperience}}" onClick="{{pickExperience}}">Experience</button>
<button type="button" class="orr-btn" aria-pressed="{{isWorld}}" onClick="{{pickWorld}}">World</button>
</div>

<div aria-live="polite" style="position: absolute; left: 600px; top: 192px; width: 616px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 64px; line-height: 1.02; font-weight: 400; letter-spacing: -0.015em; font-variation-settings: 'opsz' 72">{{ring.question}}</h1>
<p style="margin: 0; font-size: 30px; line-height: 1.3; font-style: italic; font-variation-settings: 'opsz' 24">{{ring.meaning}}</p>
</div>

<div style="position: absolute; left: 600px; top: 384px; width: 320px; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 2px solid var(--ink)">
<p class="orr-label orr-muted" style="margin: 0">At the coffee shop · r = {{ring.r}}</p>
<p style="margin: 0; font-size: 28px; line-height: 1.3; font-variation-settings: 'opsz' 24">{{ring.example}}</p>
</div>

<figure style="position: absolute; right: 64px; top: 360px; margin: 0; display: flex; align-items: flex-end; gap: 20px">
<figcaption style="display: flex; flex-direction: column; gap: 6px; text-align: right; width: 150px">
<span class="orr-label">Fig. 03 · Nautilus</span>
<span class="orr-label orr-muted">Growth in proportion</span>
</figcaption>
<img class="orr-cutout" src="../assets/cutouts/nautilus.png" alt="Engraved nautilus shell, its chambers growing in proportion" style="height: 240px; width: auto; flex: none">
</figure>

<nav aria-label="Sections" style="position: absolute; right: 64px; bottom: 48px; display: flex; align-items: center; gap: 28px">
<svg class="orr-svg" viewBox="0 0 172 12" width="172" height="12" aria-hidden="true">
<circle class="orr-tp" cx="6" cy="6" r="4.5"></circle>
<circle class="orr-tp" cx="26" cy="6" r="4.5"></circle>
<circle class="orr-core" cx="46" cy="6" r="5"></circle>
<circle class="orr-core--unfilled" cx="66" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="86" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="106" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="126" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="146" cy="6" r="4.5"></circle>
<circle class="orr-core--unfilled" cx="166" cy="6" r="4.5"></circle>
</svg>
<a class="orr-btn orr-btn--text" href="Circles1.dc.html" style="display: inline-flex; align-items: center; color: var(--muted)">Previous</a>
<a class="orr-btn orr-btn--text" href="Circles3.dc.html" style="display: inline-flex; align-items: center; color: var(--muted)">Next</a>
</nav>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["product","experience","world"],"default":"experience"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var RINGS = {
      product: { i: 0, r: 1, question: 'What can I do?', meaning: 'The useful core.', example: 'Get a good cup, reliably.' },
      experience: { i: 1, r: 2, question: 'How does it feel?', meaning: 'Everything around using it.', example: 'Ordering feels welcoming, not intimidating.' },
      world: { i: 2, r: 3, question: 'What am I part of?', meaning: 'The identity, culture and community people help create.', example: 'Regulars, tastings, “our place.”' }
    };
    var sel = this.state && this.state.sel ? this.state.sel : (this.props.start || 'experience');
    var k = RINGS[sel].i;
    function cls(i) {
      if (i > k) return 'orr-ring orr-ring--unfilled';
      return i === 2 ? 'orr-ring orr-ring--world' : 'orr-ring';
    }
    function fill(i) { return i === k ? 'var(--ink)' : 'var(--muted)'; }
    function pick(id) { return function () { self.setState({ sel: id }); }; }
    return {
      ring: RINGS[sel],
      c1: cls(0), c2: cls(1), c3: cls(2),
      f1: fill(0), f2: fill(1), f3: fill(2),
      isProduct: sel === 'product', isExperience: sel === 'experience', isWorld: sel === 'world',
      pickProduct: pick('product'), pickExperience: pick('experience'), pickWorld: pick('world')
    };
  }
}
</script>
</body>
</html>
